<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4e8">
  <title>Claire 的星願森林</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f4e8;
      --paper-bright: #fffdf5;
      --ink: #24352f;
      --muted: #64746a;
      --forest: #315547;
      --forest-deep: #203d34;
      --leaf: #718e62;
      --leaf-light: #b7cd91;
      --rose: #db7a9d;
      --rose-light: #f5d6df;
      --sun: #f2c65d;
      --water: #73c1c6;
      --line: #d7ddc9;
      --shadow: rgba(32, 61, 52, .16);
      --serif: "Iowan Old Style", "Songti TC", "Noto Serif TC", Georgia, serif;
      --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 9% 9%, rgba(233, 190, 201, .23), transparent 25rem),
        radial-gradient(ellipse at 95% 43%, rgba(151, 191, 157, .20), transparent 28rem),
        var(--paper);
      font-family: var(--sans);
      line-height: 1.5;
      padding: 0 max(18px, env(safe-area-inset-left)) max(34px, env(safe-area-inset-bottom));
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #d27398; outline-offset: 3px; }

    .page { width: min(1120px, 100%); margin: 0 auto; }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 23px 0 17px;
      border-bottom: 1px solid rgba(49, 85, 71, .18);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border-radius: 50% 50% 45% 45%;
      color: #fff7ec;
      background: var(--forest);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .13);
      font-size: 23px;
    }
    .brand-copy { min-width: 0; }
    .eyebrow {
      margin: 0 0 1px;
      color: var(--forest);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(20px, 3vw, 29px);
      font-weight: 700;
      line-height: 1.2;
    }
    .birthday-tag {
      flex: 0 0 auto;
      padding: 7px 12px;
      border: 1px solid #e8c1ce;
      border-radius: 2px 12px 2px 12px;
      color: #843e5c;
      background: #fff7f8;
      font-size: 12px;
      font-weight: 800;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      align-items: start;
      gap: 25px;
      padding-top: 21px;
    }
    .map-column { min-width: 0; }
    .map-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }
    .map-heading h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.2;
    }
    .map-heading p { margin: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .map-count { color: var(--forest); font-size: 12px; font-weight: 900; white-space: nowrap; }

    .map-frame {
      position: relative;
      width: 100%;
      max-width: 690px;
      margin: 0 auto;
      overflow: hidden;
      aspect-ratio: 450 / 849;
      border: 5px solid #466a51;
      border-radius: 38px 38px 30px 30px;
      background: #c9dba7;
      box-shadow: 0 14px 0 #294b3d, 0 22px 38px var(--shadow);
      isolation: isolate;
    }
    .scene-art, .route-art, .tile-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-image-stack { position: absolute; z-index: -2; inset: 0; overflow: hidden; }
    .map-image { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: fill; }
    .scene-art, .route-art { display: none; }
    .tile-layer { z-index: 2; }
    .route-shadow {
      fill: none;
      stroke: rgba(46, 69, 48, .30);
      stroke-width: 21;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .route-ribbon {
      fill: none;
      stroke: #f5e9c7;
      stroke-width: 15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .route-dash {
      fill: none;
      stroke: rgba(174, 139, 86, .65);
      stroke-width: 2;
      stroke-dasharray: 3 10;
      stroke-linecap: round;
    }
    .tile {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(22px, 3.8vw, 29px);
      aspect-ratio: 1;
      padding: 0;
      transform: translate(-50%, -50%) rotate(var(--tilt, -3deg));
      border: 0;
      border-radius: 0;
      color: var(--ink);
      background: transparent;
      box-shadow: none;
      cursor: default;
      transition: box-shadow .18s ease, filter .18s ease;
    }
    .tile-animal { font-size: clamp(19px, 3.6vw, 24px); line-height: 1; }
    .tile-number {
      position: absolute;
      right: -3px;
      bottom: -3px;
      display: none;
      place-items: center;
      min-width: 15px;
      height: 15px;
      padding: 0 3px;
      border: 1px solid #fffdf5;
      border-radius: 8px;
      color: #fff;
      background: var(--forest);
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
    }
    .tile-mark {
      position: absolute;
      top: -7px;
      left: -7px;
      display: grid;
      place-items: center;
      width: 19px;
      height: 19px;
      border: 1px solid #fffdf5;
      border-radius: 50%;
      color: var(--ink);
      background: var(--sun);
      box-shadow: 0 2px 3px rgba(32, 61, 52, .18);
      font-size: 11px;
      line-height: 1;
    }
    .tile[data-type="treasure"], .tile[data-type="item"], .tile[data-type="fate"], .tile[data-type="challenge"], .tile[data-type="coin"] { background: transparent; box-shadow: none; }
    .tile.start-tile, .tile.finish-tile { width: clamp(25px, 4.2vw, 32px); }
    .tile.current-stop { z-index: 4; filter: drop-shadow(0 0 5px #ed91b0); transform: translate(-50%, -50%) scale(1.2) rotate(var(--tilt, -3deg)); }
    .player-token {
      position: absolute;
      z-index: 5;
      display: grid;
      place-items: center;
      width: clamp(34px, 6vw, 42px);
      height: clamp(34px, 6vw, 42px);
      transform: translate(-50%, -50%);
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 8px rgba(25, 29, 25, .3);
      pointer-events: none;
      transition: left 1s cubic-bezier(.2,.8,.25,1), top 1s cubic-bezier(.2,.8,.25,1);
    }
    .player-token img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .side-panel { position: sticky; top: 16px; display: grid; gap: 13px; }
    .status-block {
      padding: 17px 17px 15px;
      border-top: 4px solid var(--forest);
      background: var(--paper-bright);
      box-shadow: 0 8px 20px rgba(39, 62, 49, .08);
    }
    .status-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .status-top h2 { margin: 0; font-family: var(--serif); font-size: 19px; }
    .step-count { color: var(--forest); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .music-toggle { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 30px; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--forest); background: var(--paper-bright); font-size: 17px; cursor: pointer; }
    .music-toggle[aria-pressed="true"] { border-color: #92aa79; background: #e8f1db; }
    .progress-track { height: 8px; margin: 12px 0 13px; overflow: hidden; border-radius: 8px; background: #e6e9db; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #759469, #e0a1b5); transition: width .3s ease; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .stat { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .stat-icon { font-size: 20px; }
    .stat-label { display: block; color: var(--muted); font-size: 10px; font-weight: 800; }
    .stat-value { display: block; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .current-tile { display: flex; align-items: center; gap: 9px; min-height: 36px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .current-animal { font-size: 22px; }
    .current-copy { min-width: 0; }
    .current-copy small { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
    .current-copy strong { display: block; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

    .action-box { padding: 17px; color: #f9f7eb; background: var(--forest); box-shadow: 0 8px 0 #284638; }
    .action-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .action-heading h2 { margin: 0; font-family: var(--serif); font-size: 17px; }
    .die-face { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 11px; color: var(--ink); background: #fff9e9; box-shadow: inset 0 -3px 0 #ddcfad; font-size: 22px; font-weight: 900; }
    .action-copy { min-height: 38px; margin: 0 0 13px; color: #d9e3d3; font-size: 12px; }
    .action-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 49px;
      padding: 10px 14px;
      border: 0;
      border-radius: 3px 14px 3px 14px;
      color: #332a2b;
      background: var(--sun);
      box-shadow: 0 4px 0 #c59c40;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
    }
    .action-button:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    .action-button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #c59c40; }
    .action-button:disabled { cursor: wait; opacity: .7; }
    .secondary-button { width: 100%; margin-top: 13px; padding: 7px; border: 1px solid rgba(255,255,255,.25); color: #eaf0e5; background: transparent; font-size: 11px; font-weight: 800; cursor: pointer; }

    .info-block { padding: 15px 16px; border-left: 3px solid var(--rose); background: rgba(255, 253, 245, .76); }
    .info-block h3 { margin: 0 0 9px; font-family: var(--serif); font-size: 16px; }
    .inventory { display: flex; flex-wrap: wrap; gap: 6px; min-height: 29px; }
    .inventory-empty { color: var(--muted); font-size: 11px; }
    .inventory-item { padding: 4px 7px; border: 1px solid #d8ddca; border-radius: 2px 9px 2px 9px; color: #435c48; background: #f1f5e8; font-size: 11px; font-weight: 800; }
    .log-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .log-item { display: grid; grid-template-columns: 20px 1fr; gap: 7px; color: #4a5e50; font-size: 11px; }
    .log-item time { color: #849080; font-variant-numeric: tabular-nums; }
    .fine-print { margin: 15px 0 0; color: var(--muted); font-size: 10px; text-align: center; }

    .modal[hidden] { display: none; }
    .modal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: rgba(23, 39, 32, .62);
      animation: fade-in .18s ease-out;
    }
    .modal-panel {
      position: relative;
      width: min(390px, 100%);
      max-height: min(88vh, 700px);
      overflow-y: auto;
      padding: 27px 25px 23px;
      border: 4px solid #fff8e9;
      border-radius: 4px 24px 4px 24px;
      color: var(--ink);
      background: var(--paper-bright);
      box-shadow: 0 15px 0 rgba(36, 53, 47, .28), 0 28px 60px rgba(0,0,0,.24);
      text-align: center;
      animation: pop-in .24s cubic-bezier(.2,.8,.3,1.2);
    }
    .modal-panel.is-grand { border-color: #f2c65d; background: #fff9e8; }
    .modal-icon { display: grid; place-items: center; width: 70px; height: 70px; margin: 0 auto 12px; border-radius: 50%; background: #f1f3e5; font-size: 39px; }
    .modal-kicker { margin: 0 0 5px; color: #8b5a68; font-size: 10px; font-weight: 900; letter-spacing: 1px; }
    .modal-title { margin: 0 0 9px; font-family: var(--serif); font-size: 25px; line-height: 1.25; }
    .modal-text { margin: 0 auto 18px; max-width: 300px; color: #58675d; font-size: 14px; white-space: pre-line; }
    .wheel-wrap {
      position: relative;
      width: 124px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
    }
    .wheel-wrap[hidden] { display: none; }
    .wheel {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 5px solid #fff;
      border-radius: 50%;
      background: conic-gradient(#f3c75e 0 120deg, #84c8bf 120deg 240deg, #df91ac 240deg 360deg);
      box-shadow: 0 0 0 2px #d5c6a2, 0 6px 0 #b6a57d;
      transition: transform 1.45s cubic-bezier(.12,.72,.15,1);
    }
    .wheel-pointer { position: absolute; z-index: 2; top: -11px; left: calc(50% - 9px); width: 0; height: 0; border-right: 9px solid transparent; border-bottom: 18px solid #263d32; border-left: 9px solid transparent; }
    .wheel::after { position: absolute; inset: 42px; border: 3px solid #fff8e8; border-radius: 50%; background: #314f41; content: "✦"; color: #fff8e8; display: grid; place-items: center; font-size: 17px; }
    .modal-action { min-width: 150px; min-height: 44px; padding: 9px 20px; border: 0; border-radius: 3px 12px 3px 12px; color: #fffaf0; background: var(--forest); box-shadow: 0 4px 0 #203c32; font-weight: 900; cursor: pointer; }
    .modal-action:active { transform: translateY(2px); box-shadow: 0 2px 0 #203c32; }
    .grand-note { margin: -4px 0 15px; color: #8a6531; font-size: 12px; font-weight: 800; }
    .birthday-confetti { position: absolute; top: 10px; right: 10px; font-size: 22px; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-in { from { transform: translateY(12px) scale(.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes die-roll { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.05); } 55% { transform: rotate(10deg) scale(.96); } 80% { transform: rotate(-5deg); } }
    .die-face.rolling { animation: die-roll .4s ease-in-out 5; }

    @media (max-width: 820px) {
      body { padding-right: max(14px, env(safe-area-inset-right)); padding-left: max(14px, env(safe-area-inset-left)); }
      .game-layout { grid-template-columns: minmax(0, 1fr) 260px; gap: 17px; }
      .map-frame { border-radius: 30px 30px 25px 25px; }
      .side-panel { gap: 10px; }
      .status-block, .action-box, .info-block { padding: 13px; }
    }
    @media (max-width: 660px) {
      body { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
      .masthead { padding-top: 15px; }
      .brand-mark { width: 38px; height: 38px; flex-basis: 38px; font-size: 20px; }
      .birthday-tag { padding: 6px 8px; font-size: 10px; }
      .game-layout { grid-template-columns: 1fr; gap: 15px; padding-top: 16px; }
      .map-column { grid-row: 2; }
      .side-panel { position: static; grid-row: 1; gap: 10px; }
      .status-block { padding: 11px 13px; }
      .status-top h2 { font-size: 16px; }
      .progress-track { height: 6px; margin: 8px 0; }
      .current-tile { min-height: 30px; margin-top: 8px; padding-top: 7px; }
      .action-box { position: fixed; z-index: 30; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); left: max(10px, env(safe-area-inset-left)); display: grid; grid-template-columns: 1fr minmax(145px, .75fr); align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 4px 15px 4px 15px; box-shadow: 0 8px 22px rgba(26, 48, 39, .28); }
      .action-heading { grid-column: 1; margin: 0; }
      .action-heading h2 { font-size: 14px; }
      .die-face { width: 32px; height: 32px; border-radius: 8px; font-size: 18px; }
      .action-copy { grid-column: 1; min-height: 0; margin: 0; font-size: 10px; line-height: 1.25; }
      .action-button { grid-column: 2; grid-row: 1 / span 2; min-height: 45px; font-size: 13px; }
      .secondary-button { display: none; }
      .info-block { padding: 12px 13px; }
      .info-block.log-block { display: none; }
      .map-heading h2 { font-size: 18px; }
      .map-heading p { font-size: 10px; }
      .map-frame { border-width: 4px; }
      .fine-print { display: none; }
    }
    @media (max-width: 380px) {
      .eyebrow { font-size: 9px; }
      h1 { font-size: 19px; }
      .birthday-tag { max-width: 82px; text-align: center; line-height: 1.2; }
      .map-heading { align-items: start; }
      .map-heading p { max-width: 90px; text-align: right; }
      .tile { width: 34px; }
      .tile.start-tile, .tile.finish-tile { width: 41px; }
      .player-token { width: 35px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🐴</div>
        <div class="brand-copy">
          <p class="eyebrow">Claire's birthday quest · 12</p>
          <h1>Claire 的星願森林</h1>
        </div>
      </div>
      <div class="birthday-tag">只為 Claire 準備</div>
    </header>

    <main class="game-layout">
      <section class="map-column" aria-labelledby="mapTitle">
        <div class="map-heading">
          <div>
            <h2 id="mapTitle">星願森林石板路</h2>
            <p>跟著酷洛米沿著石板前進</p>
          </div>
        </div>

        <div class="map-frame" id="mapFrame" aria-label="生肖森林石板路">
          <div class="map-image-stack" aria-hidden="true">
            <img class="map-image" src="./map/all.jpg" alt="">
          </div>
          <svg class="scene-art" viewBox="0 0 520 940" preserveAspectRatio="none" role="img" aria-label="有河流、木橋、山丘與花草的森林">
            <defs>
              <linearGradient id="meadow" x1="0" y1="0" x2=".8" y2="1">
                <stop offset="0" stop-color="#dce7b6" />
                <stop offset=".52" stop-color="#b9d39a" />
                <stop offset="1" stop-color="#93ba89" />
              </linearGradient>
              <linearGradient id="stream" x1="0" y1="0" x2="1" y2=".3">
                <stop offset="0" stop-color="#88d0cb" />
                <stop offset=".48" stop-color="#65b9c3" />
                <stop offset="1" stop-color="#a2dfd3" />
              </linearGradient>
              <pattern id="meadowDots" width="36" height="36" patternUnits="userSpaceOnUse">
                <circle cx="5" cy="8" r="1.5" fill="#f7f2ce" opacity=".55" />
                <circle cx="28" cy="23" r="1.2" fill="#557a53" opacity=".24" />
                <path d="M17 29q3-5 5 0" fill="none" stroke="#fff8dc" stroke-width="1" opacity=".55" />
              </pattern>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#274536" flood-opacity=".2" />
              </filter>
            </defs>
            <rect width="520" height="940" fill="url(#meadow)" />
            <path d="M0 0h520v176q-72 27-148-2T210 188Q102 219 0 169Z" fill="#abc887" opacity=".54" />
            <path d="M0 280q83-36 154 1t157-1q101-42 209 11v197q-96 37-180 4t-165 8Q79 533 0 498Z" fill="#d4dfa7" opacity=".68" />
            <path d="M0 601q102-32 183 8t161 1q86-39 176-8v338H0Z" fill="#83ad7d" opacity=".5" />
            <rect width="520" height="940" fill="url(#meadowDots)" opacity=".75" />
            <g fill="none" stroke="#e9efcd" stroke-width="2" opacity=".58">
              <path d="M-30 137q110-66 233-16t237 4q66-9 112-48" />
              <path d="M-40 150q115-65 239-17t236 4q64-8 112-45" />
              <path d="M-30 542q100-50 214-10t197-2q75-33 163-4" />
              <path d="M-30 555q100-50 214-10t197-2q75-33 163-4" />
              <path d="M-30 811q96-46 192-3t207 0q83-35 157 2" />
              <path d="M-30 824q96-46 192-3t207 0q83-35 157 2" />
            </g>
            <path d="M-20 441c86 27 119 89 208 69 83-19 111-95 198-67 58 19 96 62 151 52v85c-64 4-104-27-157-43-67-20-107 69-191 88-106 24-156-52-229-79-27-10-47-10-70-6Z" fill="#609e9e" opacity=".35" />
            <path d="M-20 431c86 27 119 89 208 69 83-19 111-95 198-67 58 19 96 62 151 52v77c-64 4-104-27-157-43-67-20-107 69-191 88-106 24-156-52-229-79-27-10-47-10-70-6Z" fill="url(#stream)" />
            <path d="M-10 461c82 28 120 68 194 51 77-18 113-91 195-60 60 22 96 53 160 51" fill="none" stroke="#dbfaf0" stroke-width="4" opacity=".58" />

            <div class="stat"><span class="stat-icon" aria-hidden="true">🎁</span><span><span class="stat-label">生日大獎</span><span class="stat-value" id="prizeState">等待揭曉</span></span></div>
          </div>

          <h3 id="inventoryTitle">口袋裡的收藏</h3>

        </section>

          <h3 id="logTitle">森林手札</h3>
          <ul class="log-list" id="eventLog"><li class="log-item"><span>🌿</span><span>微風正等著你出發。</span></li></ul>

  <div class="modal" id="eventModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText" hidden>
    <div class="modal-panel" id="modalPanel">
      <span class="birthday-confetti" id="modalDecoration" aria-hidden="true"></span>
      <div class="modal-icon" id="modalIcon" aria-hidden="true">🌸</div>
      <p class="modal-kicker" id="modalKicker">森林小事件</p>
      <h2 class="modal-title" id="modalTitle">發現一份驚喜</h2>
      <div class="wheel-wrap" id="fateWheel" aria-hidden="true" hidden><div class="wheel" id="wheelDisc"></div><span class="wheel-pointer"></span></div>
      <p class="modal-text" id="modalText"></p>
      <p class="grand-note" id="grandNote" hidden>真正的生日禮物，由家人為你準備 ✦</p>
      <button class="modal-action" id="modalAction" type="button">繼續旅程</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const ROUTE_POINTS = [
        [76.44, 2.12], [80, 5.89], [80.44, 9.42], [76.44, 13.19], [69.33, 15.55],
        [58.67, 17.2], [49.78, 19.08], [40.44, 19.08], [29.78, 21.2], [23.56, 21.91],
        [17.33, 23.32], [14.67, 26.38], [12.89, 30.62], [7.11, 33.92], [11.56, 36.51],
        [14.67, 40.52], [22.22, 42.4], [32.44, 43.11], [40.44, 44.52], [49.78, 45.47],
        [58.67, 45.23], [65.33, 46.64], [72.44, 45.47], [80, 49], [87.56, 53],
        [89.33, 56.54], [92, 60.31], [94.22, 64.55], [94.22, 70.91], [87.11, 76.09],
        [80.44, 77.97], [72.44, 77.97], [66.67, 76.09], [62.22, 74.56], [57.11, 70.79],
        [48, 70.08], [38.22, 69.85], [28.89, 72.91], [27.11, 76.09], [31.56, 79.03],
        [40.44, 80.57], [49.78, 84.81], [52, 91.87], [54.67, 94.94], [58.67, 98.23],
      ];
      const SPACE_COUNT = ROUTE_POINTS.length;
      const FINISH_INDEX = SPACE_COUNT - 1;
      const ZODIAC = [
        { name: "鼠", emoji: "🐭" }, { name: "牛", emoji: "🐮" },
        { name: "虎", emoji: "🐯" }, { name: "兔", emoji: "🐰" },
        { name: "龍", emoji: "🐉" }, { name: "蛇", emoji: "🐍" },
        { name: "馬", emoji: "🐴" }, { name: "羊", emoji: "🐐" },
        { name: "猴", emoji: "🐵" }, { name: "雞", emoji: "🐔" },
        { name: "狗", emoji: "🐶" }, { name: "豬", emoji: "🐷" },
      ];
      const EVENT_LAYOUT = (() => {
        const layout = { 0: "start", [FINISH_INDEX]: "finish" };
        const events = [
          [.12, "coin"], [.18, "challenge"], [.25, "item"], [.32, "treasure"],
          [.39, "fate"], [.45, "coin"], [.52, "challenge"], [.59, "treasure"],
          [.66, "item"], [.73, "fate"], [.80, "coin"], [.86, "challenge"],
          [.93, "treasure"], [.98, "fate"],
        ];
        for (const [progress, type] of events) {
          const index = Math.max(1, Math.min(FINISH_INDEX - 1, Math.round(FINISH_INDEX * progress)));
          if (!(index in layout)) layout[index] = type;
        }
        return layout;
      })();
      const EVENT_INFO = {
        start: { icon: "🏁", label: "起點", name: "森林起點" },
        coin: { icon: "🪙", label: "金幣", name: "金幣小徑" },
        treasure: { icon: "💎", label: "寶藏", name: "森林寶藏" },
        item: { icon: "🧿", label: "道具", name: "幸運道具" },
        fate: { icon: "🎡", label: "命運", name: "命運轉盤" },
        challenge: { icon: "🏓", label: "挑戰", name: "球拍亭挑戰" },
        finish: { icon: "🏆", label: "終點", name: "星願終點" },
        normal: { icon: "", label: "生肖", name: "生肖花徑" },
      };
      const FATE_RESULTS = [
        { index: 0, icon: "🪙", title: "星星金幣！", text: "命運轉盤停在金色星星，森林送你 8 枚金幣。", coins: 8 },
        { index: 1, icon: "🌟", title: "幸運星願吊飾！", text: "一枚小小星願吊飾落進口袋，今天的運氣真好。", item: "星願吊飾" },
        { index: 2, icon: "🎁", title: "Claire 的生日大獎！", text: "轉盤亮起最閃耀的星星！你贏得了 12 歲生日特別大獎！", grandPrize: true },
      ];

      const state = {
        position: 0,
        coins: 0,
        inventory: [],
        started: false,
        busy: false,
        gameOver: false,
        grandPrize: false,
        fateSpins: 0,
        modalAction: null,
      };

      const $ = (id) => document.getElementById(id);
      const mapFrame = $("mapFrame");
      const tileLayer = $("tileLayer");
      const token = $("playerToken");
      const actionButton = $("actionButton");
      const musicToggle = $("musicToggle");
      const modal = $("eventModal");
      const modalPanel = $("modalPanel");
      const modalAction = $("modalAction");
      const tiles = [];

      function routePosition(index) {
        const [x, y] = ROUTE_POINTS[index];
        return { x, y };
      }

      function shuffledZodiac() {
        const animals = [...ZODIAC];
        for (let index = animals.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [animals[index], animals[swapIndex]] = [animals[swapIndex], animals[index]];
        }
        return animals;
      }

      function makeTiles() {
        const points = [];
        const zodiacOrder = shuffledZodiac();
        for (let index = 0; index < SPACE_COUNT; index++) {
          const event = EVENT_LAYOUT[index] || "normal";
          const animal = index === 0 ? ZODIAC[6] : zodiacOrder[(index - 1) % zodiacOrder.length];
          const point = routePosition(index);
          points.push(point);
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.dataset.type = event;
          tile.dataset.index = String(index);
          tile.setAttribute("aria-label", `${index + 1} 格，${animal.name}，${EVENT_INFO[event].name}`);
          tile.style.left = `${point.x}%`;
          tile.style.top = `${point.y}%`;
          tile.style.setProperty("--tilt", `${((index % 5) - 2) * 1.4}deg`);
          if (event === "start") tile.classList.add("start-tile");
          if (event === "finish") tile.classList.add("finish-tile");
          tile.innerHTML = `<span class="tile-animal" aria-hidden="true">${animal.emoji}</span><span class="tile-number">${index + 1}</span>${event !== "normal" ? `<span class="tile-mark" aria-hidden="true">${EVENT_INFO[event].icon}</span>` : ""}`;
          tileLayer.appendChild(tile);
          tiles.push({ element: tile, animal, event, point, index });
        }
        updateToken();
      }

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      function updateToken() {
        const current = tiles[state.position];
        token.style.left = `${current.point.x}%`;
        token.style.top = `${current.point.y}%`;
        tiles.forEach((tile, index) => tile.element.classList.toggle("current-stop", index === state.position));
        $("stepCount").textContent = `${state.position + 1} / ${SPACE_COUNT} 格`;
        $("progressFill").style.width = `${state.position / FINISH_INDEX * 100}%`;
        $("progressTrack").setAttribute("aria-valuenow", String(state.position));
        $("progressTrack").setAttribute("aria-valuemax", String(FINISH_INDEX));
        $("coinCount").textContent = String(state.coins);
        $("prizeState").textContent = state.grandPrize ? "已經獲得！" : "等待揭曉";
        $("currentAnimal").textContent = state.position === 0 ? "🐴" : current.animal.emoji;
        $("currentLabel").textContent = `第 ${state.position + 1} 格 · ${current.animal.name}生肖`;
        $("currentName").textContent = EVENT_INFO[current.event].name;
        $("statusTitle").textContent = state.gameOver ? "星願旅程完成" : state.started ? "旅程進行中" : "旅程準備中";
        $("actionHeading").textContent = state.gameOver ? "生日大冒險完成！" : state.started ? "下一步交給骰子" : "準備好出發了嗎？";
        $("actionCopy").textContent = state.gameOver
          ? "森林記住了你的勇氣與好運。"
          : state.busy ? "酷洛米正沿著石板路前進……" : state.started ? "每次擲骰前進，看看森林為你準備了什麼。" : "擲出第一顆骰子，開啟你的生日旅程。";
        $("actionLabel").textContent = state.started ? (state.gameOver ? "再玩一次" : "擲骰前進") : "開始冒險";
        actionButton.disabled = state.busy;
      }

      function addLog(icon, text) {
        const log = $("eventLog");
        const entry = document.createElement("li");
        entry.className = "log-item";
        entry.innerHTML = `<span>${icon}</span><span>${text}</span>`;
        log.prepend(entry);
        while (log.children.length > 4) log.lastElementChild.remove();
      }

      function renderInventory() {
        const inventory = $("inventory");
        inventory.replaceChildren();
        if (!state.inventory.length) {
          const empty = document.createElement("span");
          empty.className = "inventory-empty";
          empty.textContent = "沿途收集小小幸運";
          inventory.appendChild(empty);
          return;
        }
        for (const item of state.inventory) {
          const badge = document.createElement("span");
          badge.className = "inventory-item";
          badge.textContent = item;
          inventory.appendChild(badge);
        }
      }

      function openModal({ icon, kicker = "森林小事件", title, text, action = "繼續旅程", grand = false, wheel = false, decoration = "" }, onClose) {
        modalPanel.classList.toggle("is-grand", grand);
        $("modalIcon").textContent = icon;
        $("modalKicker").textContent = kicker;
        $("modalTitle").textContent = title;
        $("modalText").textContent = text;
        $("modalDecoration").textContent = decoration;
        $("grandNote").hidden = !grand;
        $("fateWheel").hidden = !wheel;
        modalAction.textContent = action;
        state.modalAction = onClose || null;
        modal.hidden = false;
        modalAction.focus({ preventScroll: true });
      }

      function closeModal() {
        if (modal.hidden) return;
        modal.hidden = true;
        const next = state.modalAction;
        state.modalAction = null;
        if (next) next();
        else updateToken();
      }

      function spinFate({ guaranteed = false, onClose } = {}) {
        let result;
        if (guaranteed) {
          result = FATE_RESULTS[2];
        } else {
          result = FATE_RESULTS[state.fateSpins % FATE_RESULTS.length];
          state.fateSpins++;
        }
        if (result.coins) state.coins += result.coins;
        if (result.item) state.inventory.push(result.item);
        if (result.grandPrize) state.grandPrize = true;
        renderInventory();
        updateToken();
        const wheel = $("wheelDisc");
        wheel.hidden = false;
        wheel.style.transition = "none";
        wheel.style.transform = "rotate(0deg)";
        openModal({
          icon: result.icon,
          kicker: guaranteed ? "終點的生日命運" : "命運轉盤 · 試試今天的手氣",
          title: result.title,
          text: result.text,
          action: "繼續旅程",
          grand: result.grandPrize,
          wheel: true,
          decoration: result.grandPrize ? "✦" : "",
        }, onClose);
        const centers = [60, 180, 300];
        const extra = (360 - centers[result.index]) % 360;
        requestAnimationFrame(() => {
          wheel.style.transition = "transform 1.45s cubic-bezier(.12,.72,.15,1)";
          wheel.style.transform = `rotate(${1080 + extra}deg)`;
        });
      }

      function showFinish() {
        state.gameOver = true;
        state.busy = false;
        updateToken();
        addLog("🏆", "抵達星願森林終點，生日旅程完成！");
        openModal({
          icon: "🎂",
          kicker: "HAPPY 12TH BIRTHDAY",
          title: "Claire，生日快樂！",
          text: `你走完了 ${SPACE_COUNT} 格星願森林，所有好運都陪你抵達終點。祝你新的一歲，天天都有值得開心的事！`,
          action: "再玩一次",
          grand: true,
          decoration: "✦",
        }, resetGame);
      }

      function resolveLanding() {
        const landed = tiles[state.position];
        const finishAfterModal = () => {
          if (state.position === FINISH_INDEX) {
            if (state.grandPrize) showFinish();
            else spinFate({ guaranteed: true, onClose: showFinish });
          } else {
            state.busy = false;
            updateToken();
          }
        };

        switch (landed.event) {
          case "coin":
            state.coins += 5;
            updateToken();
            addLog("🪙", "撿到 5 枚森林金幣。");
            openModal({ icon: "🪙", title: "叮！找到金幣", text: "陽光照亮石縫，Claire 撿到 5 枚森林金幣。" }, finishAfterModal);
            break;
          case "treasure":
            state.coins += 10;
            state.inventory.push("森林寶石");
            renderInventory();
            updateToken();
            addLog("💎", "打開寶箱，得到寶石和 10 枚金幣。");
            openModal({ icon: "💎", title: "森林寶箱打開了！", text: "裡面有一顆閃閃發亮的森林寶石，還有 10 枚金幣。" }, finishAfterModal);
            break;
          case "item": {
            const item = landed.index > FINISH_INDEX * .6 ? "小馬幸運鈴" : "星願葉書籤";
            state.inventory.push(item);
            renderInventory();
            updateToken();
            addLog("🧿", `收到道具：${item}。`);
            openModal({ icon: "🧿", title: "發現森林小道具", text: `這是送給 Claire 的「${item}」，把它收進口袋吧。` }, finishAfterModal);
            break;
          }
          case "fate":
            addLog("🎡", "命運轉盤轉出一份生日好運。");
            spinFate({ onClose: finishAfterModal });
            break;
          case "challenge":
            state.inventory.push("勇氣徽章");
            renderInventory();
            updateToken();
            addLog("🏓", "球拍亭送出一枚勇氣徽章。");
            openModal({ icon: "🏓", kicker: "山谷球拍亭", title: "挑戰即將登場！", text: "這裡藏著一個桌球小挑戰，會在第二階段揭曉。今天先收下球拍亭送你的勇氣徽章！" }, finishAfterModal);
            break;
          case "finish":
            addLog("🏁", "抵達星願森林終點。");
            if (state.grandPrize) showFinish();
            else spinFate({ guaranteed: true, onClose: showFinish });
            break;
          default:
            addLog(landed.animal.emoji, `經過第 ${state.position + 1} 格的${landed.animal.name}生肖花徑。`);
            state.busy = false;
            updateToken();
        }
      }

      let diceAudioContext;
      let backgroundMusicEnabled = true;
      let backgroundMusicSource = null;
      let backgroundMusicGain = null;
      let backgroundMusicBuffer = null;

      function createBackgroundMusicBuffer(context) {
        const duration = 8;
        const sampleRate = context.sampleRate;
        const buffer = context.createBuffer(1, Math.floor(sampleRate * duration), sampleRate);
        const samples = buffer.getChannelData(0);
        const melody = [72, 76, 79, 76, 74, 76, 81, 79, 72, 76, 79, 84, 81, 79, 76, 74];
        const chords = [[48, 55, 60], [53, 60, 65], [55, 62, 67], [45, 52, 57]];
        const frequency = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
        const chordAt = (notes, time) =>
          Math.sin(2 * Math.PI * frequency(notes[0]) * time) * .012 +
          Math.sin(2 * Math.PI * frequency(notes[1]) * time) * .009 +
          Math.sin(2 * Math.PI * frequency(notes[2]) * time) * .006;

        for (let index = 0; index < samples.length; index++) {
          const time = index / sampleRate;
          const beat = Math.floor(time / .5);
          const noteTime = time - beat * .5;
          const noteFrequency = frequency(melody[beat % melody.length]);
          const envelope = Math.exp(-noteTime * 7) * Math.min(1, noteTime / .018);
          const pluck = (Math.sin(2 * Math.PI * noteFrequency * noteTime) +
            Math.sin(4 * Math.PI * noteFrequency * noteTime) * .18) * envelope * .17;
          const bar = Math.floor(time / 2) % chords.length;
          const blend = Math.min(1, Math.max(0, ((time % 2) - 1.72) / .28));
          const harmony = chordAt(chords[bar], time) * (1 - blend) +
            chordAt(chords[(bar + 1) % chords.length], time) * blend;
          const fade = Math.max(0, Math.min(1, time / .03, (duration - time) / .08));
          samples[index] = (pluck + harmony) * fade;
        }
        return buffer;
      }

      function startBackgroundMusic() {
        if (!backgroundMusicEnabled || backgroundMusicSource) return;
        const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextConstructor) return;
        try {
          diceAudioContext ||= new AudioContextConstructor();
        } catch {
          return;
        }
        const context = diceAudioContext;
        if (context.state === "suspended") void context.resume().catch(() => {});
        backgroundMusicBuffer ||= createBackgroundMusicBuffer(context);
        backgroundMusicSource = context.createBufferSource();
        backgroundMusicGain = context.createGain();
        backgroundMusicSource.buffer = backgroundMusicBuffer;
        backgroundMusicSource.loop = true;
        backgroundMusicGain.gain.setValueAtTime(.0001, context.currentTime);
        backgroundMusicGain.gain.exponentialRampToValueAtTime(.24, context.currentTime + 1.2);
        backgroundMusicSource.connect(backgroundMusicGain);
        backgroundMusicGain.connect(context.destination);
        backgroundMusicSource.start();
      }

      function stopBackgroundMusic() {
        if (!backgroundMusicSource) return;
        const context = diceAudioContext;
        const stopAt = context.currentTime + .18;
        backgroundMusicGain.gain.cancelScheduledValues(context.currentTime);
        backgroundMusicGain.gain.setValueAtTime(Math.max(.0001, backgroundMusicGain.gain.value), context.currentTime);
        backgroundMusicGain.gain.exponentialRampToValueAtTime(.0001, stopAt);
        backgroundMusicSource.stop(stopAt);
        backgroundMusicSource = null;
        backgroundMusicGain = null;
      }

      function updateMusicToggle() {
        musicToggle.setAttribute("aria-pressed", String(backgroundMusicEnabled));
        musicToggle.setAttribute("aria-label", backgroundMusicEnabled ? "關閉背景音樂" : "開啟背景音樂");
        musicToggle.textContent = backgroundMusicEnabled ? "♫" : "♪";
      }


      function playDiceRollSound() {
        const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextConstructor) return;
        try {
          diceAudioContext ||= new AudioContextConstructor();
        } catch {
          return;
        }

        const context = diceAudioContext;
        if (context.state === "suspended") void context.resume().catch(() => {});
        const duration = .08;
        const buffer = context.createBuffer(1, Math.ceil(context.sampleRate * duration), context.sampleRate);
        const samples = buffer.getChannelData(0);
        for (let index = 0; index < samples.length; index++) {
          samples[index] = (Math.random() * 2 - 1) * (1 - index / samples.length);
        }

        const start = context.currentTime + .02;
        for (let tick = 0; tick < 17; tick++) {
          const time = start + tick * .115 + Math.random() * .03;
          const source = context.createBufferSource();
          const filter = context.createBiquadFilter();
          const gain = context.createGain();
          source.buffer = buffer;
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(900 + Math.random() * 900, time);
          filter.Q.setValueAtTime(1.1, time);
          gain.gain.setValueAtTime(.0001, time);
          gain.gain.exponentialRampToValueAtTime(.035, time + .008);
          gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(context.destination);
          source.start(time);
          source.stop(time + duration);
        }
      }

      async function rollTurn() {
        if (state.busy || state.gameOver) return;
        state.busy = true;
        updateToken();
        const result = Math.floor(Math.random() * 6) + 1;
        const die = $("dieFace");
        const rollingFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
        die.textContent = "⚄";
        die.classList.remove("rolling");
        void die.offsetWidth;
        die.classList.add("rolling");
        playDiceRollSound();
        const rollTicker = window.setInterval(() => {
          die.textContent = rollingFaces[Math.floor(Math.random() * rollingFaces.length)];
        }, 110);
        await wait(2000);
        window.clearInterval(rollTicker);
        die.classList.remove("rolling");
        die.textContent = String(result);
        const destination = Math.min(FINISH_INDEX, state.position + result);
        while (state.position < destination) {
          state.position++;
          updateToken();
          await wait(1000);
        }
        resolveLanding();
      }

      function resetGame() {
        state.position = 0;
        state.coins = 0;
        state.inventory = [];
        state.started = false;
        state.busy = false;
        state.gameOver = false;
        state.grandPrize = false;
        state.fateSpins = 0;
        $("dieFace").textContent = "⚄";
        $("eventLog").replaceChildren();
        addLog("🌿", "微風正等著你出發。");
        renderInventory();
        updateToken();
      }

      actionButton.addEventListener("click", () => {
        if (state.gameOver) {
          resetGame();
          return;
        }
        if (!state.started) {
          state.started = true;
          startBackgroundMusic();
          addLog("🐴", "Claire 的小馬踏上生肖星願森林步道。");
          updateToken();
          return;
        }
        rollTurn();
      });
      musicToggle.addEventListener("click", () => {
        backgroundMusicEnabled = !backgroundMusicEnabled;
        updateMusicToggle();
        if (backgroundMusicEnabled) startBackgroundMusic();
        else stopBackgroundMusic();
      });
      updateMusicToggle();
      modalAction.addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal && !state.busy) closeModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden && !state.busy) closeModal();
      });

      makeTiles();
      renderInventory();
      updateToken();
    })();
  </script>
</body>
</html>
